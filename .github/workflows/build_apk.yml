name: Build HEEX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Native Android Scaffolding & Build Release APK
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp lib/main.dart /tmp/main.dart.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          rm -rf android ios
          flutter create . --project-name argobeats_spotify --org com.argobeats.music --platforms=android,ios
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HEEX-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

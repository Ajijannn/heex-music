name: Build HEEX Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate Native Android Project & Build Release APK
        run: |
          set -e
          rm -rf /tmp/heex_build
          mkdir -p /tmp/heex_build
          cd /tmp/heex_build
          flutter create --org com.heex.music --project-name heex_music --platforms=android .
          rm -rf test
          flutter pub add http just_audio path_provider file_picker shared_preferences url_launcher
          cat << 'MAN_EOF' | base64 -d -i | gunzip > android/app/src/main/AndroidManifest.xml
